# Runner & Environment Parameters
num_steps_per_env: 24
max_iterations: 1500
save_interval: 50
check_for_nan: true
obs_groups:
  actor: ["state"]
  critic: ["state"]

# PPO Algorithm Parameters
algorithm:
  class_name: "PPO"
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.01
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: "adaptive"
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: "adam"

# Actor Architecture (Your custom RNN parameters go here)
actor:
  class_name: "RNNModel"
  rnn_type: "lstm"
  rnn_hidden_size: 512
  rnn_num_layers: 1
  hidden_dims: [512, 256, 128]
  activation: "elu"
  distribution_cfg:
    class_name: "GaussianDistribution"
    init_std: 1.0

# Critic Architecture
critic:
  class_name: "RNNModel"
  rnn_type: "lstm"
  rnn_hidden_size: 512
  rnn_num_layers: 1
  hidden_dims: [512, 256, 128]
  activation: "elu"